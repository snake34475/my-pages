  .item::before {

    width: 9px; height: 9px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--ac, #a78bfa);
    transition: background .2s;

  .item .row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }

  .item .cat { font-size: 11.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 100px; padding: 2px 10px; }
